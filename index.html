<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Super Finger Cricket Mania 🏏</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: #ffcc00;
            text-shadow: 2px 2px 10px rgba(255, 204, 0, 0.5);
            font-size: 2.2rem;
        }
        .btn {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            margin: 8px;
            cursor: pointer;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.08);
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
        }
        .game-box {
            margin-top: 20px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
            width: 90%;
        }
        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            margin: 8px;
            text-align: center;
            width: 80%;
        }
        #timer {
            font-size: 32px;
            color: #ff3333;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
        }
        .runs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>🏏 🔥 பிங்கர் கிரிக்கெட் மேனியா ⚡</h1>
    
    <!-- 1. பிளேயர் எண்ணிக்கை தேர்வு மற்றும் பெயர்கள் -->
    <div id="setup-screen" class="game-box">
        <h3>👥 எத்தனை வீரர்கள்?</h3>
        <button class="btn" onclick="selectPlayers(2)">2 பிளேயர்ஸ் ⚔️</button>
        <button class="btn" onclick="selectPlayers(3)">3 பிளேயர்ஸ் 🏆</button>
        <button class="btn" onclick="selectPlayers(4)">4 பிளேயர்ஸ் ⚡</button>
        <button class="btn" onclick="selectPlayers(5)">5 பிளேயர்ஸ் 🔥</button>
    </div>

    <!-- பெயர்களை உள்ளிடும் ஸ்கிரீன் -->
    <div id="name-screen" class="game-box" style="display:none;">
        <h3>✍️ வீரர்களின் பெயர்கள்:</h3>
        <div id="name-inputs"></div>
        <button class="btn" onclick="startTheGame()" style="background: linear-gradient(45deg, #00b09b, #96c93d);">கேமைத் தொடங்கு 🚀</button>
    </div>

    <!-- 2. கேம் ஸ்கிரீன் (சுழற்சி முறை) -->
    <div id="game-screen" class="game-box" style="display:none;">
        <h2 id="current-player-turn" style="color: #ffcc00;">Player Turn</h2>
        <div id="timer">⏱️ 5s</div>
        <p>விரலைத் தேர்ந்தெடுக்கவும் (1 to 6):</p>
        <div class="runs-grid">
            <button class="btn" onclick="makeMove(1)">1 ☝️</button>
            <button class="btn" onclick="makeMove(2)">2 ✌️</button>
            <button class="btn" onclick="makeMove(3)">3 🤟</button>
            <button class="btn" onclick="makeMove(4)">4 🚀 4(Boundary)</button>
            <button class="btn" onclick="makeMove(5)">5 🖐️</button>
            <button class="btn" onclick="makeMove(6)">6 🔥 6(Maximum)</button>
        </div>
    </div>

    <!-- 3. ரிசல்ட் ஸ்கிரீன் -->
    <div id="result-screen" class="game-box" style="display:none;">
        <h2>🎉 ரவுண்ட் ரிசல்ட்</h2>
        <div id="special-effect" style="font-size: 26px; margin: 12px 0;"></div>
        <p id="round-result" style="font-size: 18px; line-height: 1.6;"></p>
        <hr style="border-color: rgba(255,255,255,0.2);">
        <h3 id="scoreboard" style="font-size: 20px; color: #00ffcc;"></h3>
        <button class="btn" onclick="nextBall()">அடுத்த பந்து ➡️</button>
    </div>

    <script>
        let numPlayers = 2;
        let playerNames = [];
        let scores = [];
        let moves = [];
        let currentPlayerIndex = 0;
        let timeLeft = 5;
        let timerInterval;

        function selectPlayers(count) {
            numPlayers = count;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('name-screen').style.display = 'block';
            
            let html = "";
            for (let i = 0; i < numPlayers; i++) {
                html += `<input type="text" id="p-name-${i}" placeholder="Player ${i+1} பெயர்" value="Player ${i+1}"><br>`;
            }
            document.getElementById('name-inputs').innerHTML = html;
        }

        function startTheGame() {
            playerNames = [];
            scores = new Array(numPlayers).fill(0);
            for (let i = 0; i < numPlayers; i++) {
                let name = document.getElementById(`p-name-${i}`).value.trim();
                playerNames.push(name || `Player ${i+1}`);
            }
            document.getElementById('name-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            currentPlayerIndex = 0;
            startTurn();
        }

        function startTurn() {
            timeLeft = 5;
            document.getElementById('current-player-turn.innerText = `🎮 ${playerNames[currentPlayerIndex]} இன் முறை!`;
            document.getElementById('current-player-turn').innerText = `🎮 ${playerNames[currentPlayerIndex]} இன் முறை!`;
            document.getElementById('timer').innerText = `⏱️ ${timeLeft}s`;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `⏱️ ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    makeMove(0); // Timeout - 0 run
                }
            }, 1000);
        }

        function makeMove(runs) {
            clearInterval(timerInterval);
            moves.push(runs);
            currentPlayerIndex++;

            if (currentPlayerIndex < numPlayers) {
                startTurn();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            let resultText = "";
            let maxRun = 0;
            for (let i = 0; i < numPlayers; i++) {
                resultText += `<b>${playerNames[i]}</b>: ${moves[i]} விரல் காட்டினார்<br>`;
                scores[i] += moves[i];
                if (moves[i] > maxRun) maxRun = moves[i];
            }

            let fx = "";
            if (maxRun === 6) {
                fx = "🔥 MASSIVE SIX! சிக்சர் பறக்குது! 🚀💥🔥";
            } else if (maxRun === 4) {
                fx = "🎯 SUPER FOUR! பவுண்டரி பாய்ந்துவிட்டது! ⚡🏏";
            } else if (maxRun === 0) {
                fx = "❌ டைம் அவுட் / ஜீரோ ரன்! 💨";
            } else {
                fx = "🏃‍♂️ நல்ல ரன்னிங்! சிங்கிள்ஸ் ஓடியாயிற்று! 👍";
            }

            document.getElementById('special-effect').innerHTML = fx;
            document.getElementById('round-result').innerHTML = resultText;
            
            let scoreText = "<b>📊 தற்போதைய ஸ்கோர்:</b><br>";
            for (let i = 0; i < numPlayers; i++) {
                scoreText += `${playerNames[i]}: <b>${scores[i]} ரன்கள்</b><br>`;
            }
            document.getElementById('scoreboard').innerHTML = scoreText;
        }

        function nextBall() {
            moves = [];
            currentPlayerIndex = 0;
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            startTurn();
        }
    </script>

</body>
</html>
